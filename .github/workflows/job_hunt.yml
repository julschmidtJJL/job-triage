name: Job Hunt Pipeline

on:
  schedule:
    # 05:17 UTC = 07:17 CEST / 06:17 CET. Off the full hour on purpose: GitHub
    # delays scheduled runs most at the top of the hour (the 06:00 run on
    # 15 Oct started at 11:11).
    - cron: '17 5 * * *'
  workflow_dispatch:      # allow manual trigger from the GitHub UI
    inputs:
      send_report:
        description: 'Send the weekly report email now (it goes out on Mondays anyway)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: nothing written to the board, no saved state; letters are printed'
        type: boolean
        default: false
      letters_only:
        description: 'Only draft cover letters for Apply rows that have none yet (no scraping)'
        type: boolean
        default: false

jobs:
  run-pipeline:
    # Scheduled runs only start once you set the repository variable
    # JOBHUNT_ENABLED=true (Settings → Secrets and variables → Actions →
    # Variables), so a fresh fork doesn't fail every morning without keys.
    # A manual run from the Actions tab always starts.
    if: github.event_name == 'workflow_dispatch' || vars.JOBHUNT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access is for BOARD=csv, which commits board/ back (last step);
    # a Notion board never writes to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # BOARD=csv commits your job board to this repository (last step):
      # stop before any work if the repository is public.
      - name: Check the board can be committed
        if: ${{ vars.BOARD == 'csv' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::BOARD=csv commits your job board to this repository. Make it private first."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cross-run state without a database: every file the pipeline learns
      # from lives in data/ and rides along in the Actions cache. The key is
      # unique per run, so each run saves a fresh copy; restore-keys picks the
      # latest one. A daily job never reaches the 7-day eviction window.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/jobs_seen_urls.json
            data/learned_stoplist.json
            data/holdover_queue.json
            data/decision_history.json
            data/query_stats.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      - name: Run pipeline
        if: ${{ !inputs.letters_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOARD: ${{ vars.BOARD }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_JOB_BOARD_DB_ID: ${{ secrets.NOTION_JOB_BOARD_DB_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FIT_PROFILE: ${{ secrets.FIT_PROFILE }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEND_REPORT: ${{ inputs.send_report }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      # Only after a successful run: a failed run (no scoring, no delivery)
      # must not mark its jobs as seen, so the next run retries them.
      # A dry run must not mark jobs as seen either.
      - name: Save pipeline state
        if: success() && !inputs.dry_run && !inputs.letters_only
        uses: actions/cache/save@v4
        with:
          path: |
            data/jobs_seen_urls.json
            data/learned_stoplist.json
            data/holdover_queue.json
            data/decision_history.json
            data/query_stats.json
          key: pipeline-state-${{ github.run_id }}

      # A base cover letter for each Apply row without one, as a child page of
      # the row (Notion) or in board/letters/ (csv). Opt-in: set the repository variable LETTERS_ENABLED=true and
      # the LETTER_FACTS secret. Runs after the state is saved, so a failed
      # letter never makes the next run re-score jobs, and also when the
      # scrape failed. The log names each row's job and company: keep a
      # repository that drafts letters private.
      - name: Draft cover letters
        if: ${{ !cancelled() && (vars.LETTERS_ENABLED == 'true' || inputs.letters_only) }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOARD: ${{ vars.BOARD }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          FIT_PROFILE: ${{ secrets.FIT_PROFILE }}
          LETTER_FACTS: ${{ secrets.LETTER_FACTS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/draft_letters.py --dry-run
          else
            python scripts/draft_letters.py
          fi

      # BOARD=csv: the board is the board/ folder, so the run commits it back,
      # also after a failed run (the rows it wrote stay, as they would on
      # Notion). Never in a public repository: the board names every job you
      # looked at and what you decided. If you pushed an edit to jobs.csv
      # during the run, the merge driver keeps your cells and the new rows.
      - name: Commit the board
        if: ${{ !cancelled() && vars.BOARD == 'csv' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::error::BOARD=csv commits your job board to this repository. Make it private first."
            exit 1
          fi
          [ -d board ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git config merge.jobs-csv.driver "python -m job_board.csv_board merge %O %A %B"
          git add -f board
          git diff --cached --quiet && exit 0
          git commit -q -m "board: run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
